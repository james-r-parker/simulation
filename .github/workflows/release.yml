name: release

# docs/designs/deployment-and-community.md, "Release workflow". Called by release-please.yml when the release PR is merged
# (never triggered by the `release` or tag event, so it runs once). A manual run with an older tag is the rollback: it
# rebuilds that tag and redeploys it to /; the index step is a no-op for a release already stored.
#   gh workflow run release.yml -f tag=v<version>
#
# Two jobs: `build` holds no secret; `deploy` holds the production secrets and runs no repository npm script.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, v<major>.<minor>.<patch>
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, v<major>.<minor>.<patch> (an older tag rolls back)
        required: true
        type: string

permissions:
  contents: read

# The release index is read, changed and written by one run at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bad tag: $TAG" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # No `cache:`: nothing a release build writes may be read by another workflow.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: scripts/check.sh --ci
      - name: Build the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-release.mjs "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist
            dist-release
            release-entry.json
            blob-evolution-*-dist.tar.gz
            functions
            migrations
            wrangler.toml
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    permissions:
      contents: write
    steps:
      # The tag's own scripts (release-upload.mjs, the Functions) - the same commit the build job built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .
      - name: Install wrangler
        working-directory: .github/deploy
        run: npm ci --ignore-scripts
      - name: Attach the build to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        # --clobber: a repair or rollback run uploads the same file again.
        run: gh release upload "$TAG" "blob-evolution-$VERSION-dist.tar.gz" --clobber
      - name: Apply migrations to the production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler d1 migrations apply blob-library --remote
      # The release is served by its own Pages deployment (branch v<major>-<minor>-<patch>, free plan, no R2). The
      # deployment and its D1 row exist before / changes, so the site never links a version that is not served.
      - name: Deploy the release to its own Pages branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          branch="v${VERSION//./-}"
          sha="$(git rev-parse HEAD)"
          .github/deploy/node_modules/.bin/wrangler pages deploy dist-release --project-name "$PAGES_PROJECT" --branch "$branch" --commit-hash "$sha" --commit-dirty=true
      - name: Register the release in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: .github/deploy/node_modules/.bin/wrangler
        run: node scripts/release-upload.mjs release-entry.json
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -o pipefail
          sha="$(git rev-parse HEAD)"
          .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$sha" --commit-dirty=true | tee deploy.log
          url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          echo "{\"event\":\"ReleaseDeployed\",\"version\":\"$VERSION\",\"url\":\"${url}\"}"
          {
            echo "### Released $VERSION"
            echo "- Commit: \`$sha\`"
            echo "- Deployment: ${url:-see the Cloudflare Pages dashboard}"
          } >>"$GITHUB_STEP_SUMMARY"

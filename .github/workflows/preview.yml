name: preview

# docs/designs/deployment-and-community.md, "Preview workflow". After a green `check`, a push to main (or season/next)
# goes to /next/ and a pull request from this repo goes to a preview. It never deploys production: production follows a
# release (deploy.yml), and every deploy here goes to a non-production Pages branch (`next`, `main-latest`, `pr-<n>`)
# with the `-preview` database.
#
# Four jobs, so no job runs repository code and holds a secret:
#   plan    - no secrets; reads the event and wrangler.toml
#   build   - no secrets, no cache, no persisted credentials; runs the commit's own npm scripts
#   deploy  - environment `preview`; runs no repository npm script, only the lockfile-installed wrangler
#   comment - no Cloudflare secrets; posts the preview URL on the pull request

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      branch: ${{ steps.plan.outputs.branch }}
      sha: ${{ steps.plan.outputs.sha }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      # The default branch: workflow_run always runs the default branch's workflow file and script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: plan
        run: node scripts/deploy-plan.mjs

  build:
    needs: plan
    if: needs.plan.outputs.action != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # No `cache:`: a workflow_run build that wrote the npm cache would let pull request code poison the default branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      # /next/ is served under its prefix by the /next/ Function; a PR preview has its own host and serves from /.
      - name: Build
        env:
          ACTION: ${{ needs.plan.outputs.action }}
        run: |
          if [[ "$ACTION" == next ]]; then
            npx vite build --base /next/
          else
            npm run build
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist
            functions
            migrations
          if-no-files-found: error

  deploy:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # The `preview` environment is created by the user (Settings, Environments) with its own Cloudflare token. When it
      # is missing or incomplete this job fails here, by name, before any wrangler call; it never falls back to another
      # token and never deploys to production.
      - name: Require the preview environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$PAGES_PROJECT" ]] || missing+=("variable PAGES_PROJECT")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::The 'preview' GitHub environment (or the repository) is missing: ${missing[*]}. Create environment 'preview' in Settings, Environments, with the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/designs/deployment-and-community.md, Phase 1 setup checklist, step 4). Nothing was deployed and production is untouched."
            exit 1
          fi
      # The default branch's wrangler.toml and the pinned wrangler; the artifact only adds dist/, functions/ and migrations/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .
      - name: Install wrangler
        working-directory: .github/deploy
        run: npm ci --ignore-scripts
      - name: Apply migrations to the preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler d1 migrations apply blob-library-preview --env preview --remote
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          BRANCH: ${{ needs.plan.outputs.branch }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # The default shell is `bash -e` without pipefail: without this, a failed wrangler piped into tee would pass.
          set -o pipefail
          # plan only returns pr-<n>, next or main-latest; a production branch name is refused here as well.
          if [[ ! "$BRANCH" =~ ^(pr-[0-9]+|next|main-latest)$ ]]; then
            echo "::error::refusing to deploy to branch '$BRANCH' from the preview workflow"
            exit 1
          fi
          .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch "$BRANCH" --commit-hash "$SHA" --commit-dirty=true | tee deploy.log
          url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          {
            echo "### Deployed $BRANCH"
            echo "- Commit: \`$SHA\`"
            echo "- Deployment: ${url:-see the Cloudflare Pages dashboard}"
          } >>"$GITHUB_STEP_SUMMARY"

  comment:
    needs: [plan, deploy]
    if: needs.plan.outputs.action == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # One comment per pull request: update the marked one, else create it.
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          URL: ${{ needs.deploy.outputs.url }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          body="$(node scripts/preview-comment.mjs)"
          marker="$(head -1 <<<"$body")"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

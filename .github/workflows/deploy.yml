name: deploy

# docs/designs/deployment-and-community.md, "Phase 1a - Release PR and deploy on release". Production on Cloudflare Pages
# changes only when the release PR is merged: release-please.yml calls this workflow with the new tag. A push to main
# deploys nothing. A manual run redeploys a tag, or the dispatched ref when no tag is given (a rollback).
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (empty - the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

# Deploys queue in order; a running deploy is never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://matrix.dotnethelp.co.uk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged commit of the release; the dispatched commit for a manual run without a tag.
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The repo's own pinned wrangler (package.json); the project and its production branch are in wrangler.toml.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The default shell is `bash -e` without pipefail: without this, a failed wrangler piped into tee would pass.
          set -o pipefail
          sha="$(git rev-parse HEAD)"
          npx wrangler pages deploy dist --project-name matrix --branch main --commit-hash "$sha" --commit-dirty=true | tee deploy.log
          url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          {
            echo "### Deployed to production"
            echo "- Commit: \`$sha\`"
            echo "- Site: https://matrix.dotnethelp.co.uk"
            echo "- Deployment: ${url:-see the Cloudflare Pages dashboard}"
          } >>"$GITHUB_STEP_SUMMARY"

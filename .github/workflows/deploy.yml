name: deploy

# docs/designs/deployment-and-community.md, "Phase 1a" and "Release workflow". Production on Cloudflare Pages changes only
# here: release-please.yml calls this workflow with the new tag when the release PR is merged. A push to main deploys
# nothing (preview.yml serves /next/). A manual run redeploys a tag, or the dispatched ref when no tag is given - that is
# the rollback path:
#   gh workflow run deploy.yml -f tag=v<version>
#
# Two jobs, so no job runs repository code and holds a secret:
#   build  - no secrets, no cache, no persisted credentials; runs the commit's own npm scripts
#   deploy - environment `production`; runs no repository npm script, only the lockfile-installed wrangler and
#            scripts/release-upload.mjs (a plain node script)

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy, v<major>.<minor>.<patch>
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (empty - the dispatched ref, using its package.json version)
        required: false
        type: string

permissions:
  contents: read

# The release index is read, changed and written by one run at a time; a running deploy is never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged commit of the release; the dispatched commit for a manual run without a tag.
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      # The release version is the package.json version of the commit (the release PR writes it); a tag must agree.
      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$version' is not major.minor.patch"
            exit 1
          fi
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "::error::tag '$TAG' does not match package.json version '$version' at that tag"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # No `cache:`: nothing a release build writes may be read by another workflow.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      # The release PR already ran `check` and `browser-smoke` on the combined main, so the build is not gated again.
      - name: Build the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:release -- "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist
            dist-release
            release-entry.json
            blob-evolution-*-dist.tar.gz
            functions
            migrations
            wrangler.toml
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    permissions:
      contents: write
    steps:
      # Without the production secrets and variables nothing can be deployed; say which one is missing.
      - name: Require the production environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("secret CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$PAGES_PROJECT" ]] || missing+=("variable PAGES_PROJECT")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::The 'production' environment (or the repository) is missing: ${missing[*]}. Nothing was deployed."
            exit 1
          fi
      # The tag's own scripts (release-upload.mjs, wrangler.toml) - the same commit the build job built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: .
      - name: Install wrangler
        working-directory: .github/deploy
        run: npm ci --ignore-scripts
      # Only a release tag has a GitHub Release to attach to; --clobber because a repair or rollback uploads it again.
      - name: Attach the build to the GitHub Release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release upload "$TAG" "blob-evolution-$VERSION-dist.tar.gz" --clobber
      - name: Apply migrations to the production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/deploy/node_modules/.bin/wrangler d1 migrations apply blob-library --remote
      # The release is served by its own Pages deployment (branch v<major>-<minor>-<patch>, free plan, no R2). The
      # deployment and its D1 row exist before / changes, so the site never links a version that is not served.
      - name: Deploy the release to its own Pages branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          branch="v${VERSION//./-}"
          sha="$(git rev-parse HEAD)"
          .github/deploy/node_modules/.bin/wrangler pages deploy dist-release --project-name "$PAGES_PROJECT" --branch "$branch" --commit-hash "$sha" --commit-dirty=true
      - name: Register the release in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: .github/deploy/node_modules/.bin/wrangler
        run: node scripts/release-upload.mjs release-entry.json
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The default shell is `bash -e` without pipefail: without this, a failed wrangler piped into tee would pass.
          set -o pipefail
          sha="$(git rev-parse HEAD)"
          .github/deploy/node_modules/.bin/wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$sha" --commit-dirty=true | tee deploy.log
          url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          echo "{\"event\":\"ReleaseDeployed\",\"version\":\"$VERSION\",\"url\":\"${url}\"}"
          {
            echo "### Deployed $VERSION to production"
            echo "- Commit: \`$sha\`"
            echo "- Site: https://${SITE_DOMAIN:-matrix.dotnethelp.co.uk}"
            echo "- Deployment: ${url:-see the Cloudflare Pages dashboard}"
          } >>"$GITHUB_STEP_SUMMARY"

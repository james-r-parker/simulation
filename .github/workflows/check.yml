name: check

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue: `check` and `browser-smoke` (the required checks on main) run on the queued merge commit, which is
  # main plus the PR, so a PR no longer has to be re-run each time main moves.
  merge_group:
  workflow_dispatch:
    inputs:
      noise:
        description: Measure benchmark noise only (bench-compare --self) instead of the PR gates
        type: boolean
        default: true

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. A push to main (deploy.yml waits on its result) and a merge
# group (the queue's verdict) are never cancelled.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, always named check, whichever path it takes - so `gh pr checks` (and a required check, should the repo
  # ever get one) sees a result on every PR.
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so scripts/change-scope.sh can diff a PR against its base branch. (An expression like
          # `cond && 0 || 1` always yields 1: 0 is falsy in GitHub expressions.)
          fetch-depth: 0

      # docs: every changed path is Markdown that no build or test reads beyond the design-doc tests
      # (scripts/change-scope.sh). Pushes to main and anything unclassifiable take the full path.
      - name: Change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          scope=full
          if [[ "$EVENT" == pull_request || "$EVENT" == merge_group ]]; then
            scope="$(scripts/change-scope.sh "$BASE" || echo full)"
          fi
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Local gate
        if: steps.scope.outputs.scope != 'docs'
        run: scripts/check.sh --ci

      # conventions, designs-index, format and the tests that read this repo's Markdown.
      - name: Local gate (docs only)
        if: steps.scope.outputs.scope == 'docs'
        run: scripts/check.sh --ci --docs

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: |
            TestResults/
            .checklogs/
          if-no-files-found: ignore
          include-hidden-files: true

  # The browser smoke runs in the official Playwright image (about 2 GB), whose version is the exact @playwright/test
  # pin in package.json: scripts/browser-smoke.sh derives the tag from that pin and `docker run`s the image. The job has
  # no `container:`, because a job container is pulled before the first step even when every step is skipped. The job
  # always runs and reports (a required check must not go missing); only its steps are skipped, so the image is pulled
  # only when a path the app is built from changed (scripts/change-scope.sh --browser) or the scope is unknown.
  browser-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Browser scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          scope=browser
          if [[ "$EVENT" == pull_request || "$EVENT" == merge_group ]]; then
            scope="$(scripts/change-scope.sh --browser "$BASE" || echo browser)"
          fi
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Browser scope: $scope"

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.scope == 'browser'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.scope.outputs.scope == 'browser'
        run: npm ci

      - name: Browser smoke
        if: steps.scope.outputs.scope == 'browser'
        run: scripts/check.sh --ci --only=browser-smoke

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-logs
          path: .checklogs/
          if-no-files-found: ignore
          include-hidden-files: true

  # Alternates the PR base and head on this one runner, so the runner's speed cancels (scripts/bench-compare.mjs). It
  # always runs and reports; its steps are skipped (the job passes) when scripts/perf-scope.sh finds no path that can
  # move the step time. Advisory (continue-on-error) for two weeks after it merges, then T18 of
  # docs/designs/quality-gates-and-test-tiers.md makes it required at max(5%, 3 x measured noise).
  # Never in the merge queue: it compares a PR with its base, and is not a required check.
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Perf scope
        id: scope
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          scope="$(scripts/perf-scope.sh "$BASE" || echo perf)"
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Perf scope: $scope"

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.scope == 'perf'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.scope.outputs.scope == 'perf'
        run: npm ci

      - name: Compare step time against the base
        if: steps.scope.outputs.scope == 'perf'
        run: |
          set -o pipefail
          node scripts/bench-compare.mjs --base "origin/${{ github.base_ref }}" --sizes=500 --runs=3 --threshold=0.10 | tee bench-compare.txt
          { echo '### bench-compare'; echo '```'; cat bench-compare.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # Measures the noise alone: HEAD against a second checkout of itself (`gh workflow run check.yml -f noise=true`). T18 of
  # docs/designs/quality-gates-and-test-tiers.md records the largest spread of these runs before it sets the perf threshold.
  noise:
    if: github.event_name == 'workflow_dispatch' && inputs.noise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Compare HEAD with itself
        run: |
          set -o pipefail
          node scripts/bench-compare.mjs --self --sizes=500 --runs=3 | tee bench-noise.txt
          { echo '### bench-compare --self (noise)'; echo '```'; cat bench-noise.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

name: check

on:
  pull_request:
  # season/next batches the rule changes of the next season (docs/designs/deployment-and-community.md)
  push:
    branches: [main, season/next]
  # The merge queue: `check` and `browser-smoke` (the required checks on main) run on the queued merge commit, which is
  # main plus the PR, so a PR no longer has to be re-run each time main moves.
  merge_group:
  workflow_dispatch:
    inputs:
      noise:
        description: Measure benchmark noise only (bench-compare --self) instead of the PR gates
        type: boolean
        default: true

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. A push to main (preview.yml waits on its result) and a merge
# group (the queue's verdict) are never cancelled.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change once, for the jobs below: `docs` when every changed path is Markdown that no build or test reads
  # beyond the design-doc tests (scripts/change-scope.sh), `release` for the Release Please pull request (a diff of only
  # CHANGELOG.md, package.json, package-lock.json and .release-please-manifest.json on a `release-please--*` branch: it
  # runs this job and nothing else, and `check` reports success because it counts a skipped job as passed), `full`
  # otherwise. A push computes it against the previous tip; anything unclassifiable takes the full path.
  scope:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      mode: ${{ steps.affected.outputs.mode }}
      has_tests: ${{ steps.affected.outputs.has_tests }}
      coverage: ${{ steps.affected.outputs.coverage }}
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so scripts/change-scope.sh can diff a PR against its base branch. (An expression like
          # `cond && 0 || 1` always yields 1: 0 is falsy in GitHub expressions.)
          fetch-depth: 0

      - name: Change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          scope=full
          if [[ "$EVENT" == pull_request || "$EVENT" == merge_group ]]; then
            scope="$(scripts/change-scope.sh "$BASE" || echo full)"
          elif [[ "$EVENT" == push && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A push re-checks only what changed since the previous tip; its PR already passed the rest.
            scope="$(scripts/change-scope.sh "$BEFORE" || echo full)"
          fi
          # The release scope needs the Release Please branch: a dependency bump touches the same package files and
          # must run the whole gate. A push or a queue run has no such branch, so it takes the full path.
          if [[ "$scope" == release && "$HEAD_REF" != release-please--* ]]; then
            scope=full
          fi
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      # scripts/affected.mjs uses only Node's own modules, so the job needs no `npm ci`.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # The tests the `test` job runs and the coverage it takes (docs/designs/agent-workflow.md, Affected tests in CI). A
      # pull request runs the tests its change can reach; every other event (the push to main, the merge queue) runs the
      # whole suite, and so does a pull request whose diff the script cannot read or classify. The docs and release scopes
      # run no test. The reached list is kept as the `affected` artifact, which the full run on main compares with its
      # failures (the miss ledger).
      - name: Affected tests
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ steps.scope.outputs.scope }}
          BASE: ${{ format('origin/{0}', github.base_ref) }}
        run: |
          if [[ "$SCOPE" == docs || "$SCOPE" == release ]]; then
            {
              echo "mode=$SCOPE"
              echo has_tests=false
              echo coverage=none
              echo 'matrix={"include":[]}'
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--out affected.json --github-output "$GITHUB_OUTPUT")
          if [[ "$EVENT" == pull_request ]]; then
            node scripts/affected.mjs "$BASE" "${args[@]}" || node scripts/affected.mjs --full "${args[@]}"
          else
            node scripts/affected.mjs --full "${args[@]}"
          fi

      - name: Upload the reached tests
        if: github.event_name == 'pull_request' && steps.affected.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: affected
          path: affected.json
          if-no-files-found: ignore

  # The static gates and the build (scripts/check.sh --ci): conventions, designs-index, format, lint, typecheck, deps,
  # dupes, build and eval-smoke. On a pull request and in the merge queue the tests are the `test` and `coverage` jobs
  # below (`--skip=test`); a push to main or season/next runs the fast tests here instead, because the queue already ran the
  # whole suite on the same commit.
  static:
    needs: scope
    if: needs.scope.outputs.scope != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Prettier's content-keyed cache (scripts/check.sh PRETTIER_CACHE): a file that passed before is not formatted
      # again; a new or edited file has a new hash and is always checked. After `npm ci`, which empties node_modules.
      - name: Prettier cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ hashFiles('package-lock.json', '.prettierrc.json', '.prettierignore', '.editorconfig') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ hashFiles('package-lock.json', '.prettierrc.json', '.prettierignore', '.editorconfig') }}-

      # A change to rulesHash is a breaking commit that targets season/next (scripts/lib/release-check.mjs). The title is
      # passed through the environment, never interpolated into the script.
      - name: Release check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release-check.mjs

      - name: Local gate
        if: needs.scope.outputs.scope != 'docs'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          skip=()
          [[ "$EVENT" == push ]] || skip=(--skip=test)
          scripts/check.sh --ci ${skip[@]+"${skip[@]}"}

      # conventions, designs-index, format and the tests that read this repo's Markdown.
      - name: Local gate (docs only)
        if: needs.scope.outputs.scope == 'docs'
        run: scripts/check.sh --ci --docs

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: |
            TestResults/
            .checklogs/
          if-no-files-found: ignore
          include-hidden-files: true

  # The tests a run needs, `*.slow.test.js` included (docs/designs/quality-gates-and-test-tiers.md, Phase 4, and
  # docs/designs/agent-workflow.md, Affected tests in CI). The matrix is the `scope` job's output (scripts/affected.mjs,
  # scripts/lib/affected-matrix.mjs): a pull request gets the shards and the heavy and statistical files its change can
  # reach, every other run (the push to main) the whole suite. The jobs run side by side on their own runners, one TEST_SCOPE
  # each (scripts/lib/test-scope.mjs): `shard` (the numbered shards of everything with coverage except the two lists below,
  # or the reached files), `heavy` (HEAVY_TESTS, each file in a job of its own, so no shard waits on one) and `statistical`
  # (STATISTICAL_TESTS, one job per file, no coverage because their ray casts wrap V8's block counters). Every job uses one
  # shuffle seed, the run id, so a rerun replays the order. A run with whole-suite coverage uploads each blob report for the
  # `coverage` job; a pull request on the reached tests takes no coverage here and the `ratchet-related` job holds its
  # changed files. A run that reaches no test skips this job, which `check` counts as passed.
  test:
    name: test ${{ matrix.id }}
    needs: scope
    if: needs.scope.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: test/release-check.slow.test.js merge-bases HEAD with origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Test job
        env:
          TEST_SCOPE: ${{ matrix.pass }}
          ID: ${{ matrix.id }}
          SHARD: ${{ matrix.shard }}
          FILES: ${{ matrix.files }}
          SEED: ${{ github.run_id }}
          COVERAGE: ${{ needs.scope.outputs.coverage }}
        run: |
          echo "test order seed: $SEED, job $ID (scope $TEST_SCOPE)"
          args=(--sequence.shuffle --sequence.seed="$SEED" --passWithNoTests
            --reporter=default --reporter=junit --outputFile.junit="TestResults/junit-$ID.xml")
          [[ -z "$SHARD" ]] || args+=(--shard="$SHARD")
          if [[ "$TEST_SCOPE" != statistical && "$COVERAGE" == whole ]]; then
            args+=(--coverage --coverage.reportOnFailure --reporter=blob --outputFile.blob=".vitest-reports/blob-$ID.json")
          fi
          # FILES is a path filter: unquoted on purpose, it is one file or none.
          # shellcheck disable=SC2086
          npx vitest run "${args[@]}" $FILES

      - name: Upload the blob report
        if: ${{ !cancelled() && matrix.pass != 'statistical' && needs.scope.outputs.coverage == 'whole' }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.id }}
          path: .vitest-reports/
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.id }}
          path: TestResults/
          if-no-files-found: ignore

  # Merges the blob reports of the jobs with coverage into one coverage summary and runs the coverage ratchet on it
  # (scripts/quality-ratchet.mjs --check). It runs on the whole suite only (a push, or a pull request on the full list)
  # and when a shard failed too, so a failing test never hides a coverage drop; then the summary may lack the failed
  # shard's files and the ratchet's numbers are informational.
  coverage:
    needs: [scope, test]
    if: ${{ !cancelled() && needs.scope.outputs.coverage == 'whole' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Download the blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge the shards' coverage and run the ratchet
        env:
          TESTS_RESULT: ${{ needs.test.result }}
        run: |
          status=0
          [[ "$TESTS_RESULT" == success ]] || echo "::warning::a test shard did not succeed ($TESTS_RESULT); the merged coverage may lack its files"
          npx vitest run --merge-reports=.vitest-reports --coverage --coverage.reportOnFailure || status=$?
          node scripts/quality-ratchet.mjs --check || status=$?
          exit $status

  # A pull request that runs the reached tests only holds the files it changed to their coverage baseline: it runs the tests
  # related to them with coverage and fails a changed file under a 100% baseline that is not at 100%
  # (scripts/ratchet-related.mjs, exit 3 when no changed file is under one). The whole-suite ratchet runs with the full
  # suite on the push to main.
  ratchet-related:
    needs: scope
    if: needs.scope.outputs.coverage == 'related'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Changed files at their coverage baseline
        env:
          BASE: ${{ format('origin/{0}', github.base_ref) }}
        run: |
          status=0
          node scripts/ratchet-related.mjs --base "$BASE" || status=$?
          [[ $status -eq 0 || $status -eq 3 ]]

  # The required check: it reports on every pull request and merge-queue run, whichever jobs ran, and fails when any job
  # failed or was cancelled. A job skipped by scope (docs, release) or because the change reaches no test counts as passed, so the release
  # pull request, which runs `scope` alone, still reports `check` as success.
  check:
    if: github.event_name != 'workflow_dispatch' && always()
    needs: [scope, static, test, coverage, ratchet-related]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* ]]

  # The browser smoke runs in the official Playwright image (about 2 GB), whose version is the exact @playwright/test
  # pin in package.json: scripts/browser-smoke.sh derives the tag from that pin and `docker run`s the image. The job has
  # no `container:`, because a job container is pulled before the first step even when every step is skipped. The job
  # always runs and reports (a required check must not go missing); only its steps are skipped, so the image is pulled
  # only when a path the app is built from changed (scripts/change-scope.sh --browser) or the scope is unknown.
  browser-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Browser scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          scope=browser
          if [[ "$EVENT" == pull_request || "$EVENT" == merge_group ]]; then
            scope="$(scripts/change-scope.sh --browser "$BASE" || echo browser)"
            # The Release Please pull request changes version files only: its steps are skipped, the job still reports.
            if [[ "$EVENT" == pull_request && "$HEAD_REF" == release-please--* && "$(scripts/change-scope.sh "$BASE" || echo full)" == release ]]; then
              scope=none
            fi
          elif [[ "$EVENT" == push && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A push re-checks only what changed since the previous tip; its PR already passed the rest.
            scope="$(scripts/change-scope.sh --browser "$BEFORE" || echo browser)"
          fi
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Browser scope: $scope"

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.scope == 'browser'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.scope.outputs.scope == 'browser'
        run: npm ci

      - name: Browser smoke
        if: steps.scope.outputs.scope == 'browser'
        run: scripts/check.sh --ci --only=browser-smoke

      # A spec that failed and passed on its rerun is written to .checklogs/smoke-flakes.json (scripts/browser-smoke.sh);
      # the nightly `smoke-flakes` job lists the last 7 days of them.
      - name: Upload smoke flakes
        if: always() && steps.scope.outputs.scope == 'browser'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-flakes
          path: .checklogs/smoke-flakes.json
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-logs
          path: .checklogs/
          if-no-files-found: ignore
          include-hidden-files: true

  # Alternates the PR base and head on this one runner, so the runner's speed cancels (scripts/bench-compare.mjs). It
  # always runs and reports; its steps are skipped (the job passes) when scripts/perf-scope.sh finds no path that can
  # move the step time. Advisory (continue-on-error) for two weeks after it merges, then T18 of
  # docs/designs/quality-gates-and-test-tiers.md makes it required at max(5%, 3 x measured noise).
  # Never in the merge queue: it compares a PR with its base, and is not a required check.
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Perf scope
        id: scope
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          scope="$(scripts/perf-scope.sh "$BASE" || echo perf)"
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Perf scope: $scope"

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.scope == 'perf'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.scope.outputs.scope == 'perf'
        run: npm ci

      - name: Compare step time against the base
        if: steps.scope.outputs.scope == 'perf'
        run: |
          set -o pipefail
          node scripts/bench-compare.mjs --base "origin/${{ github.base_ref }}" --sizes=500 --runs=3 --threshold=0.10 | tee bench-compare.txt
          { echo '### bench-compare'; echo '```'; cat bench-compare.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # Measures the noise alone: HEAD against a second checkout of itself (`gh workflow run check.yml -f noise=true`). T18 of
  # docs/designs/quality-gates-and-test-tiers.md records the largest spread of these runs before it sets the perf threshold.
  noise:
    if: github.event_name == 'workflow_dispatch' && inputs.noise
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Compare HEAD with itself
        run: |
          set -o pipefail
          node scripts/bench-compare.mjs --self --sizes=500 --runs=3 | tee bench-noise.txt
          { echo '### bench-compare --self (noise)'; echo '```'; cat bench-noise.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or sha to check
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.event.inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  # Tier 3 with every test and the coverage ratchet (--full; the check job runs the fast tests only): every PR gate plus mutation testing and the main-versus-branch benchmark comparison
  # (docs/designs/quality-gates-and-test-tiers.md).
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          # bench-compare needs history to find its base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Tier 3 gate
        run: scripts/check.sh --ci --full --tier 3

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports
          path: |
            .checklogs/
            reports/
            TestResults/
          if-no-files-found: ignore
          include-hidden-files: true

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
  # Every npm package in one PR, so packages that move together (vite and vitest, eslint and @eslint/js) never land
  # half-updated. Versions stay exact pins (scripts/check-conventions.sh).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: build
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    # Node stays on the current LTS (package.json engines); @types/node moves major with it, by hand.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  # wrangler for the secret-holding deploy jobs (.github/deploy); it must stay equal to the root package.json pin
  # (test/deploy-workflows.test.js), so bump both together.
  - package-ecosystem: npm
    directory: /.github/deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build

# The WASM kernels for the sim's hot numeric loops (docs/designs/wasm-kernels.md). No dependencies: the build needs no
# network. Build with scripts/build-wasm.sh, which writes the committed wasm/blob-kernels.wasm and its hash.
[package]
name = "blob-kernels"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

[profile.dev]
panic = "abort"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Blob Evolution</title>
  <!-- Source of truth for every icon: scripts/build-icons.mjs renders it with data-variant unset, "maskable" or
       "favicon" (docs/designs/web-presence.md, Icon). -->
  <style>
    .mark { transform-origin: 256px 266px; }
    .rim { display: none; }
    .eyes { transform-origin: 322px 236px; }
    svg[data-variant="maskable"] .tile { rx: 0; ry: 0; }
    svg[data-variant="maskable"] .mark { transform: scale(0.84); }
    svg[data-variant="favicon"] .tile,
    svg[data-variant="favicon"] .halo,
    svg[data-variant="favicon"] .spark,
    svg[data-variant="favicon"] .rays,
    svg[data-variant="favicon"] .bud { display: none; }
    svg[data-variant="favicon"] .mark { transform: translate(-2px, -10px) scale(1.42); }
    svg[data-variant="favicon"] .eyes { transform: scale(1.22); }
    svg[data-variant="favicon"] .rim { display: inline; }
    @media (prefers-color-scheme: dark) {
      svg[data-variant="favicon"] .rim { display: none; }
    }
  </style>
  <defs>
    <radialGradient id="tile-fill" cx="0.45" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#0f2033"/>
      <stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <radialGradient id="halo-fill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#5ee6a8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5ee6a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body-fill" cx="0.66" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c8ffe6"/>
      <stop offset="0.38" stop-color="#5ee6a8"/>
      <stop offset="1" stop-color="#17897d"/>
    </radialGradient>
    <radialGradient id="spark-fill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.3" stop-color="#ffbe3c"/>
      <stop offset="1" stop-color="#ffbe3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="tile" width="512" height="512" rx="112" ry="112" fill="url(#tile-fill)"/>
  <g class="mark">
    <circle class="halo" cx="258" cy="268" r="214" fill="url(#halo-fill)"/>
    <g class="rays" stroke="#bfe9ff" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="322" y1="236" x2="408" y2="113" stroke-opacity="0.22"/>
      <line x1="322" y1="236" x2="436" y2="157" stroke-opacity="0.4"/>
      <line x1="322" y1="236" x2="467" y2="197" stroke-opacity="0.22"/>
    </g>
    <g class="bud">
      <circle cx="118" cy="404" r="40" fill="url(#halo-fill)"/>
      <circle cx="118" cy="404" r="22" fill="url(#body-fill)"/>
    </g>
    <path class="rim" d="M96 286C92 196 168 128 262 126C362 124 424 196 420 278C416 362 344 410 252 406C160 402 100 368 96 286Z"
      fill="none" stroke="#0b3d36" stroke-width="22"/>
    <path class="body" d="M96 286C92 196 168 128 262 126C362 124 424 196 420 278C416 362 344 410 252 406C160 402 100 368 96 286Z"
      fill="url(#body-fill)"/>
    <g class="eyes">
      <circle class="eye" cx="322" cy="236" r="56" fill="#e8f4ff"/>
      <circle class="pupil" cx="342" cy="238" r="28" fill="#05080d"/>
      <circle class="glint" cx="331" cy="224" r="9" fill="#ffffff"/>
    </g>
    <g class="spark">
      <circle cx="446" cy="150" r="42" fill="url(#spark-fill)"/>
      <circle cx="446" cy="150" r="13" fill="#ffd27a"/>
    </g>
  </g>
</svg>
